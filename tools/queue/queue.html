<!DOCTYPE html>
<html>
  <head>
    <title>Pilot Applications</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/deps/spectrum/dist/tokens.css" />
    <link rel="stylesheet" href="/tools/queue/queue.css" />
  </head>
  <body>
    <div id="queue-root"></div>
    <script type="module">
      import ENV from '/scripts/utils/env.js';

      const root = document.getElementById('queue-root');
      const devRequested = new URLSearchParams(window.location.search).has('dev');

      if (root) {
        if (ENV !== 'prod' && devRequested) {
          const { default: mountDevQueue } = await import('/tools/queue/queue-dev.js');
          mountDevQueue(root);
        } else {
          const { default: init } = await import('/tools/queue/queue.js');
          init(root);
        }
      }
    </script>
  </body>
</html>
